[project]
name = "parakh"
version = "0.1.0"
description = "AI-powered indigenous digital forensics investigation framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "python-multipart>=0.0.9",
  "PyJWT>=2.15.1",
  "cryptography>=44.0.1",
  "bcrypt>=4.0.1",
  "argon2-cffi>=23.1.0",
  "pillow>=12.3.0",
  "pypdf>=4.3.0",
  "email-validator>=2.2.0",
  "networkx>=3.3",
  "ortools>=9.10.0",
  "scikit-learn>=1.5.1",
  "numpy>=1.26.4",
  "reportlab>=4.2.2",
  "python-dateutil>=2.9.0",
  "regex>=2024.7.24",
  "onnxruntime>=1.20.0",
  "tokenizers>=0.21.0",
  "pymupdf>=1.25.0",
  "anyascii>=0.3.2",

]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.mypy]
python_version = "3.11"
plugins = []
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
